# Сборка статики Next.js и публикация на GitHub Pages.
#
# ОТКЛЮЧЁН 2026-08-17. Автозапуск по push снят намеренно: в next.config.ts больше
# нет `output: "export"`, сборка не создаёт папку out/, которую публикует шаг
# upload-pages-artifact, — на каждый push workflow падал бы.
#
# Чтобы включить обратно, нужно И то, И другое:
#   1) вернуть в next.config.ts `output: "export"`, `basePath`/`assetPrefix` из
#      NEXT_PUBLIC_BASE_PATH, `images: { unoptimized: true }`, `trailingSlash: true`;
#      при этом `redirects()` придётся убрать — в статическом экспорте он не работает;
#   2) вернуть сюда блок `push: { branches: [main] }`.
#
# Пока запускается только вручную: вкладка Actions → Run workflow.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: держим один, лишние отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: next build
        # Pages отдаёт сайт по адресу https://<логин>.github.io/<имя-репозитория>/,
        # поэтому basePath = имя репозитория. Берём его из контекста, чтобы
        # переименование репо не сломало пути.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
