# Сборка статики Next.js и публикация на GitHub Pages.
# Запускается на каждый push в main, вручную, каждые пять минут
# для дайджеста и ежедневно для каталога расширений.
#
# Требует `output: "export"` в next.config.ts — публикуется папка out/,
# которую создаёт только экспорт.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
    - cron: "4 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: держим один, следующий ждёт завершения.
# Расписание не должно отменять публикацию, если GitHub Pages отвечает медленно.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Обновить каталог плагинов из GitVerse
        if: github.event_name != 'schedule' || github.event.schedule == '4 4 * * *'
        timeout-minutes: 3
        continue-on-error: true
        run: npm run sync:catalog

      - name: next build
        # Pages отдаёт сайт по адресу https://<логин>.github.io/<имя-репозитория>/,
        # поэтому basePath = имя репозитория. Берём его из контекста, чтобы
        # переименование репо не сломало пути.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
          NEXT_PUBLIC_VOTING_QUEUE_MODE: "true"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
