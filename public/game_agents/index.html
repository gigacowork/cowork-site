:root{
  --field:#F4ECDF;
  --panel:#FBF7F0;
  --ink:#1C2433;
  --ink-2:#5D6573;
  --teal:#12A5A0;
  --teal-press:#0E8C88;
  --dot:#1292B4;
  --minus:#D9622B;
  --tint-teal:#DCF0EE;
  --tint-warm:#FCEBD2;
  --visor:#FFFFFF;
  --track:#E7DFD2;
  --shadow:28,36,51;
  --glow:
    radial-gradient(60% 34% at 88% 0%,rgba(79,123,247,.22),rgba(79,123,247,0) 100%),
    radial-gradient(52% 28% at 42% 0%,rgba(63,201,214,.26),rgba(63,201,214,0) 100%),
    radial-gradient(32% 20% at 100% 22%,rgba(139,108,242,.15),rgba(139,108,242,0) 100%),
    radial-gradient(48% 26% at 0% 96%,rgba(63,201,214,.13),rgba(63,201,214,0) 100%);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --display:"SB Sans Display","SB Sans Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --text:"SB Sans Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--field);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--text);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#defs{position:absolute;width:0;height:0;overflow:hidden}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background-color:var(--field);
  background-image:radial-gradient(rgba(var(--shadow),.09) 1.2px,transparent 1.5px),var(--glow);
  background-size:18px 18px,100% 100%,100% 100%,100% 100%,100% 100%;background-position:9px 9px,0 0,0 0,0 0,0 0}
.screen.on{display:flex;animation:screenIn .35s ease-out}
@keyframes screenIn{from{opacity:0}to{opacity:1}}

/* ---------- Logo ---------- */
.logo{display:block;height:20px;width:93px;flex:none;align-self:flex-start}

/* ---------- Visor: dot-matrix plate ---------- */
.visor{display:inline-flex;align-items:center;justify-content:center;background:var(--visor);border-radius:16px;padding:10px 14px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 18px rgba(var(--shadow),.12),0 1px 3px rgba(var(--shadow),.08)}
.visor canvas{display:block}
.visor.shake{animation:shake .32s}
.visor.pulse{animation:pulse .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pulse{40%{transform:scale(1.04)}}

/* ---------- Start ---------- */
.start-inner,.end-inner{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 26px) 22px calc(var(--safe-b) + 18px);overflow-y:auto}
.start-inner .logo,.end-inner .logo{margin-bottom:20px}
/* блоки экрана не сжимаются: если места мало, экран прокручивается, а кнопка сохраняет высоту */
.start-inner>*,.end-inner>*{flex-shrink:0}
.start-inner>.grow,.end-inner>.grow{flex-shrink:1}
.hud-label{font-size:15px;line-height:20px;color:var(--ink-2);margin-bottom:8px}
.title{font-family:var(--display);font-weight:600;font-size:clamp(34px,10.5vw,46px);line-height:1.02;letter-spacing:-.01em;margin:12px 0 14px}
.lead{font-size:17px;line-height:24px;max-width:34ch}
.rules{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.rule{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 6px;border-radius:999px;font-weight:600;font-size:18px;line-height:22px;font-variant-numeric:tabular-nums}
.rule.ok{background:var(--tint-teal);color:var(--teal)}
.rule.bad{background:var(--tint-warm);color:var(--minus)}
.rule .head{width:46px;height:38px;display:block}
.rule .head svg{width:100%;height:100%;display:block}
.roster{margin-top:18px;background:var(--panel);border-radius:24px;padding:12px 8px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px;
  box-shadow:0 8px 24px rgba(var(--shadow),.07)}
.roster .ag{display:flex;flex-direction:column;align-items:center;text-align:center}
.roster .fig{width:52px;height:60px}
.roster .nm{font-weight:600;font-size:15px;line-height:19px;margin-top:4px;max-width:11ch}
.grow{flex:1;min-height:18px}
.btn{width:100%;height:58px;border-radius:18px;background:var(--teal);color:#fff;font-family:var(--display);font-weight:600;font-size:19px;
  box-shadow:0 8px 18px rgba(18,165,160,.28);transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--teal-press)}
.btn-2{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:54px;margin-top:10px;padding:8px 16px;border-radius:18px;border:2px solid var(--teal);color:var(--teal-press);font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;text-decoration:none;transition:transform .12s,background .12s}
.btn-2:active{transform:scale(.98);background:rgba(18,165,160,.08)}
.btn-2:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.foot{display:flex;justify-content:flex-start;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-2)}
.sound{display:inline-flex;align-items:center;gap:6px;padding:8px 0;color:var(--ink-2);font-size:14px}
.sound svg{width:18px;height:18px}

/* ---------- Game ---------- */
#game{touch-action:none}
.hud{position:relative;z-index:4;background-color:var(--field);background-image:var(--glow);background-size:100vw 100vh;background-position:0 0;
  padding:calc(var(--safe-t) + 22px) 20px 14px;box-shadow:0 10px 14px -10px rgba(var(--shadow),.10)}
.hud .logo{margin-bottom:22px}
.hud-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.score-pill{display:inline-flex;align-items:baseline;gap:8px;background:var(--teal);color:#fff;border-radius:999px;padding:12px 18px;margin-bottom:6px;
  box-shadow:0 6px 14px rgba(18,165,160,.25);white-space:nowrap}
.score-pill span{font-size:15px;opacity:.9}
.score-pill b{font-family:var(--display);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;display:inline-block}
.score-pill b.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.22)}}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--dot);border-radius:3px;transform-origin:left center}

#field{position:relative;flex:1;z-index:1}
#field canvas{position:absolute;inset:0;width:100%;height:100%}

.panel{position:relative;z-index:2;background:var(--panel);border-radius:30px 30px 0 0;padding:16px 8px calc(var(--safe-b) + 12px);
  box-shadow:0 -10px 26px rgba(var(--shadow),.08)}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px;max-width:460px;margin:0 auto}
.agent{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.agent .fig{position:relative;width:var(--fig,68px);height:calc(var(--fig,68px) * 1.15)}
.agent .nm{font-weight:600;font-size:14px;line-height:17px;margin-top:4px;text-align:center;max-width:11ch;min-height:34px}
.ring{position:absolute;left:50%;top:44%;width:calc(var(--fig,68px) * 1.55);height:calc(var(--fig,68px) * 1.38);transform:translate(-50%,-50%) scale(.85);
  border:3px solid var(--teal);border-radius:50%;opacity:0;transition:opacity .12s,transform .12s;pointer-events:none}
.agent.hover .ring{opacity:1;transform:translate(-50%,-50%) scale(1)}
.agent.hit .ring{opacity:1;transform:translate(-50%,-50%) scale(1.12);transition:opacity .4s .15s,transform .3s;opacity:0}

/* agent figure states: n — обычное, h — радость, o — ошибка, r — знак роли в визоре */
.fig svg{width:100%;height:100%;display:block;overflow:visible}
.face-n,.face-h,.face-o,.face-r{transition:opacity .12s}
.face-h,.face-o,.face-r{opacity:0}
.hover .face-n,.guide .face-n{opacity:0}
.hover .face-r,.guide .face-r{opacity:1}
.happy .face-n,.oops .face-n,.happy .face-r,.oops .face-r{opacity:0}
.happy .face-h,.oops .face-o{opacity:1}
.eyes{transform-box:fill-box;transform-origin:center}
.blink .eyes-n{animation:blink .2s}
@keyframes blink{50%{transform:scaleY(.1)}}
.happy .fig{animation:hop .45s cubic-bezier(.3,.7,.4,1)}
.oops .fig{animation:wobble .4s}
@keyframes hop{35%{transform:translateY(-10px) scale(1.04)}}
@keyframes wobble{20%{transform:rotate(-8deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}

/* cards */
#cards{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:12px;padding:15px 20px;background:#fff;border-radius:18px;
  border:2px solid rgba(var(--shadow),.05);white-space:nowrap;pointer-events:auto;will-change:transform;touch-action:none;
  box-shadow:0 8px 18px rgba(var(--shadow),.13),0 1px 2px rgba(var(--shadow),.08)}
.card::before{content:"";position:absolute;inset:-10px}
.card.lifted{z-index:10;border-color:var(--teal);box-shadow:0 16px 30px rgba(var(--shadow),.22)}
.card .ic.task{display:none}
.card.compact{padding:8px;gap:0;border-radius:999px;border-width:2.5px}
.card.compact .ic.task{display:grid}
.card .ic.task svg{width:40px;height:40px}
.card.compact{background:var(--tint-teal)}
.card.compact .ic.task{background:none}
.card.compact .lb{display:none}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.ic.teal,.ic.task{background:var(--tint-teal)}.ic.warm{background:var(--tint-warm)}.ic.brown{background:#F0E4D7}
.lb{font-weight:600;font-size:17px;line-height:22px}
.drag-label{position:absolute;left:0;top:0;z-index:11;background:var(--ink);color:#fff;font-weight:600;font-size:14px;line-height:18px;padding:7px 12px;border-radius:10px;
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.drag-label.on{opacity:1}

#fx{position:absolute;inset:0;z-index:6;pointer-events:none}
.agent .full{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translate(-50%,4px);background:#fff;color:var(--ink);font-size:13px;line-height:17px;font-weight:600;
  padding:5px 10px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;box-shadow:0 6px 14px rgba(var(--shadow),.14);z-index:3}
.agent:nth-child(3n+1) .full{left:4px;transform:translate(0,4px)}
.agent:nth-child(3n) .full{left:auto;right:4px;transform:translate(0,4px)}
.agent.hover .full,.agent.guide .full{opacity:1;transform:translate(-50%,0)}
/* при перетаскивании роль цели видна по знаку в визоре и кольцу, подпись не спорит с названием задачи */
.agent.hover .full{opacity:0!important}
.agent:nth-child(3n+1).hover .full,.agent:nth-child(3n+1).guide .full,.agent:nth-child(3n).hover .full,.agent:nth-child(3n).guide .full{transform:translate(0,0)}
.agent.guide .ring{opacity:1;animation:guide 1s ease-in-out infinite}
@keyframes guide{0%,100%{transform:translate(-50%,-50%) scale(.94)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.hint{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:0;transform:translateY(-6px);z-index:5;background:#fff;color:var(--teal-press);font-weight:600;font-size:15px;line-height:20px;
  padding:9px 16px;border-radius:14px;box-shadow:0 8px 18px rgba(var(--shadow),.12);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.hint.on{opacity:1;transform:translateY(0)}
.pop{position:absolute;font-family:var(--display);font-weight:600;font-size:26px;transform:translate(-50%,-50%);animation:pop .85s ease-out forwards;white-space:nowrap}
.pop.plus{color:var(--teal)}
.pop.minus{color:var(--minus)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}18%{opacity:1;transform:translate(-50%,-60%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}

/* ---------- End ---------- */
.end-agents{display:flex;justify-content:space-between;gap:2px;margin-top:6px}
.end-agents .fig{width:calc((100% - 10px)/6);max-width:56px;aspect-ratio:200/230}
.end-agents .fig:nth-child(odd){animation:hop .6s .2s both}
.end-agents .fig:nth-child(even){animation:hop .6s .35s both}
.end-title{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,40px);line-height:1.05;margin:26px 0 22px;max-width:14ch}
.score-label{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.best{font-size:16px;line-height:22px;margin-top:14px}
.best.record{color:var(--teal);font-weight:600}

@media (max-height:720px){
  .start-inner{padding-top:calc(var(--safe-t) + 16px)}
  .start-inner .logo{margin-bottom:20px}
  .start-inner .hud-label{margin-bottom:6px}
  .title{font-size:32px;margin:10px 0 10px}
  .lead{font-size:16px;line-height:22px}
  .rules{margin-top:10px}
  .roster{margin-top:14px;padding:12px 6px 10px;gap:6px 4px}
  .roster .fig{width:44px;height:51px}
  .roster .nm{font-size:14px;line-height:17px;margin-top:4px}
  .btn{height:54px}
  .foot{margin-top:8px}
  .hud{padding-top:calc(var(--safe-t) + 14px)}
  .hud .logo{margin-bottom:12px;height:18px;width:84px}
  .end-title{margin:18px 0 16px}
}
/* десктоп: игра в колонке телефонной ширины по центру, вокруг фон поля */
@media (min-width:600px){
  html,body{background-color:var(--field);background-image:radial-gradient(rgba(var(--shadow),.07) 1.2px,transparent 1.5px),var(--glow);background-size:18px 18px,100% 100%,100% 100%,100% 100%,100% 100%}
  .screen{left:calc(50% - 215px);right:auto;width:430px;box-shadow:0 0 0 1px rgba(var(--shadow),.06),0 24px 60px rgba(var(--shadow),.12)}
  .hud{background-size:430px 100vh}
}
#burst{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .screen.on,.happy .fig,.oops .fig,.end-agents .fig,.visor.pulse{animation:none!important}
}
</style>
</head>

<!-- ======== GAME ======== -->

var GLYPH={
  "0":["01110","10001","10011","10101","11001","10001","01110"],
  "1":["00100","01100","00100","00100","00100","00100","01110"],
  "2":["01110","10001","00001","00010","00100","01000","11111"],
  "3":["11111","00010","00100","00010","00001","10001","01110"],
  "4":["00010","00110","01010","10010","11111","00010","00010"],
  "5":["11111","10000","11110","00001","00001","10001","01110"],
  "6":["00110","01000","10000","11110","10001","10001","01110"],
  "7":["11111","00001","00010","00100","01000","01000","01000"],
  "8":["01110","10001","10001","01110","10001","10001","01110"],
  "9":["01110","10001","10001","01111","00001","00010","01100"],
  ":":["0","0","1","0","1","0","0"],
  " ":["00","00","00","00","00","00","00"]

function matrixCols(str){
  var c=0;for(var i=0;i<str.length;i++){c+=(GLYPH[str[i]]||GLYPH[" "])[0].length;if(i<str.length-1)c+=1}return c;
}
function drawMatrix(cv,str,pitch,dim){
  var cols=matrixCols(str),rows=7,dpr=Math.min(window.devicePixelRatio||1,3);
  var w=cols*pitch,h=rows*pitch;
  if(cv._w!==w||cv._h!==h){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+"px";cv.style.height=h+"px";cv._w=w;cv._h=h}
  var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  var r=pitch*.37,lit=[],x0=0;
  ctx.fillStyle="rgba("+DOT_RGB+",.14)";
  for(var i=0;i<str.length;i++){
    var g=GLYPH[str[i]]||GLYPH[" "],gw=g[0].length;
    for(var y=0;y<rows;y++)for(var x=0;x<gw;x++){
      var cx=(x0+x)*pitch+pitch/2,cy=y*pitch+pitch/2;
      if(g[y][x]==="1")lit.push(cx,cy);
      else{ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.fill()}
    }
    x0+=gw+1;
  }
  ctx.fillStyle=dim?"rgba("+DOT_RGB+",.55)":DOT;
  ctx.shadowColor="rgba("+DOT_RGB+",.35)";ctx.shadowBlur=pitch*.45;
  for(var k=0;k<lit.length;k+=2){ctx.beginPath();ctx.arc(lit[k],lit[k+1],r,0,6.2832);ctx.fill()}
  ctx.shadowBlur=0;
}

function frame(now){
  var dt=Math.min(.05,(now-G.last)/1000||0);G.last=now;
  if($("#game").classList.contains("on")){
    if(G.running&&!G.paused){G.time+=dt;update(dt)}
    drawConfetti(G.paused?0:dt);

function update(dt){
  if(G.tutorial){G.cards.forEach(function(c){if(c.state==="tut")place(c);else if(c.state==="return")stepReturn(c,dt)});return}
  G.remaining-=dt;
  if(G.remaining<=0){G.remaining=0;renderTimer();finish();return}
  var p=progress(),fieldH=Math.max(200,G.panelTop-G.fieldTop);
  var speed=fieldH*(.14+.26*Math.pow(p,1.4));
  var interval=p<.2?3.2:2.6-1.3*p,maxCards=p<.2?1:p<.55?2:3;
  G.spawnT+=dt;
  var active=G.cards.filter(function(c){return c.state!=="gone"}).length;
  if((G.spawnT>=interval&&active<maxCards)||(active===0&&G.spawnT>.7)){G.spawnT=0;spawn()}
  G.cards.forEach(function(c){
    if(c.state==="fall"){
      c.y+=speed*c.mul*dt;
      var over=c.y+c.h-(G.panelTop-6);
      if(over>0){c.op=1-over/38;c.el.style.opacity=Math.max(0,c.op);if(c.op<=0){removeCard(c);return}}
      else if(c.op<1){c.op=1;c.el.style.opacity=1}
      place(c);
    }else if(c.state==="return"){stepReturn(c,dt)}
  });
  G.cards=G.cards.filter(function(c){return c.state!=="gone"});
  renderTimer();
  barFill.style.transform="scaleX("+(G.remaining/DURATION).toFixed(4)+")";
}
function stepReturn(c,dt){
  c.rt+=dt;var k=clamp(c.rt/.28,0,1),e=1-Math.pow(1-k,3);
  c.y=c.ry0+(c.ry1-c.ry0)*e;c.x=c.rx0+(c.rx1-c.rx0)*e;place(c);
  if(k>=1)c.state=c.tut?"tut":"fall";
}
function renderTimer(){
  var sec=Math.ceil(G.remaining);
  if(sec!==G.lastSec){
    if(G.lastSec!==-1&&sec<=10&&sec>0&&sec<G.lastSec){sfx("tick");restartAnim(visor,"pulse")}
    G.lastSec=sec;drawMatrix(timerCv,timeStr(sec),timerPitch());
    var m10=sec%10,m100=sec%100,w=(m10===1&&m100!==11)?"секунда":(m10>=2&&m10<=4&&(m100<12||m100>14))?"секунды":"секунд";timerCv.setAttribute("aria-label","Осталось "+sec+" "+w);
  }
}
function restartAnim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

/* ---------------- drag ---------------- */
cardsLayer.addEventListener("pointerdown",function(e){
  if(!G.running||G.paused||G.drag)return;
  var el=e.target.closest&&e.target.closest(".card");if(!el)return;
  var c=null;for(var i=0;i<G.cards.length;i++)if(G.cards[i].el===el)c=G.cards[i];
  if(!c||c.state==="gone")return;
  e.preventDefault();ensureAudio();
  c.state="drag";c.op=1;el.style.opacity=1;
  /* карточка сворачивается в шайбу со знаком роли и встает над пальцем */
  c.fw=c.w;c.fh=c.h;el.classList.add("lifted","compact");c.w=el.offsetWidth;c.h=el.offsetHeight;
  dragLabel.innerHTML=TASKS[c.task].label;dragLabel.classList.add("on");c.lw=dragLabel.offsetWidth;c.lh=dragLabel.offsetHeight;
  G.drag={c:c,id:e.pointerId,ox:c.w/2,oy:c.h/2+LIFT,target:null};
  cacheSlots();moveDrag(e.clientX-(G.OX||0),e.clientY);
});
window.addEventListener("pointermove",function(e){if(G.drag&&e.pointerId===G.drag.id){e.preventDefault();moveDrag(e.clientX-(G.OX||0),e.clientY)}},{passive:false});
window.addEventListener("pointerup",function(e){if(G.drag&&e.pointerId===G.drag.id)drop()});
window.addEventListener("pointercancel",function(e){if(G.drag&&e.pointerId===G.drag.id)drop(true)});
document.addEventListener("contextmenu",function(e){e.preventDefault()});

function hitTest(px,py){
  var best=null,bd=1e9;
  for(var i=0;i<G.slots.length;i++){
    var s=G.slots[i],pad=12;
    if(px>=s.l-pad&&px<=s.r+pad&&py>=s.t-pad&&py<=s.b+pad)return i;
    var d=Math.hypot(px-s.cx,py-s.cy);if(d<bd){bd=d;best=i}
  }
  if(py>G.panelTop-24&&best!==null&&bd<G.slots[best].w*.95)return best;
  return null;
}
function setHover(i){
  if(G.drag.target===i)return;
  if(G.drag.target!==null)agentNodes[G.drag.target].classList.remove("hover");
  G.drag.target=i;
  if(i!==null){agentNodes[i].classList.add("hover");buzz(6)}
}
function moveDrag(px,py){
  var c=G.drag.c;
  c.x=clamp(px-G.drag.ox,-c.w*.5,G.W-c.w*.5);c.y=clamp(py-G.drag.oy,G.fieldTop-c.h*.6,G.H-c.h*.4);
  place(c," scale(1.05)");
  var lx=clamp(c.x+c.w/2-c.lw/2,8,G.W-c.lw-8),ly=Math.max(G.fieldTop+4,c.y-c.lh-8);
  dragLabel.style.transform="translate3d("+lx.toFixed(1)+"px,"+ly.toFixed(1)+"px,0)";
  var t=hitTest(px,py);setHover(t);drawTrail(c,t);
}
function drawTrail(c,t){
  if(t===null){trail.innerHTML="";return}
  var s=G.slots[t],x1=c.x+c.w/2,y1=c.y+c.h-4,x2=s.cx,y2=s.t+4;
  if(y2-y1<30){trail.innerHTML="";return}
  var mx=(x1+x2)/2+(x2>x1?-1:1)*30,my=(y1+y2)/2;
  trail.innerHTML='<path d="M'+x1+' '+y1+' Q'+mx+' '+my+' '+x2+' '+y2+'" fill="none" stroke="#12A5A0" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 10"/>';
}
function drop(cancelled){
  var d=G.drag,c=d.c,t=cancelled?null:d.target;
  if(d.target!==null)agentNodes[d.target].classList.remove("hover");
  G.drag=null;trail.innerHTML="";c.el.classList.remove("lifted");dragLabel.classList.remove("on");
  var consumed=G.running&&t!==null&&(!c.tut||TASKS[c.task].agent===t);
  if(!consumed)uncompact(c);
  if(!G.running){removeCard(c);return}
  if(c.tut){
    if(t!==null&&TASKS[c.task].agent===t){success(c,t);endTutorial()}
    else{if(t!==null){react(t,"oops");sfx("err");buzz([35,45,35])}c.state="return";c.rt=0;c.rx0=c.x;c.ry0=c.y;c.rx1=c.hx;c.ry1=c.hy}
    return;
  }
  if(t===null){
    c.state="fall";
    var maxY=G.panelTop-c.h-26;
    if(c.y>maxY||c.x<4||c.x+c.w>G.W-4)bounceBack(c,maxY);
    return;
  }
  if(TASKS[c.task].agent===t)success(c,t);else fail(c,t);
}
function uncompact(c){
  if(!c.el.classList.contains("compact"))return;
  var mx=c.x+c.w/2,my=c.y+c.h/2;
  c.el.classList.remove("compact");c.w=c.fw;c.h=c.fh;c.x=mx-c.w/2;c.y=my-c.h/2;place(c);
}
function bounceBack(c,maxY){
  c.state="return";c.rt=0;c.rx0=c.x;c.ry0=c.y;
  c.rx1=clamp(c.x,8,G.W-c.w-8);c.ry1=Math.min(c.y,maxY);
}
function react(i,cls){
  var n=agentNodes[i];n.classList.remove("happy","oops","hit");void n.offsetWidth;n.classList.add(cls);
  if(cls==="happy")n.classList.add("hit");
  clearTimeout(n._t);n._t=setTimeout(function(){n.classList.remove(cls,"hit")},750);
}
function popup(text,x,y,cls){
  var p=document.createElement("div");p.className="pop "+cls;p.textContent=text;
  p.style.left=x+"px";p.style.top=y+"px";fx.appendChild(p);
  p.addEventListener("animationend",function(){p.remove()});
  if(reduced)setTimeout(function(){p.remove()},700);
}
function success(c,i){
  var s=G.slots[i];c.state="gone";
  G.score+=POINTS;scoreEl.textContent=fmt(G.score);restartAnim(scoreEl,"bump");
  react(i,"happy");popup("+"+POINTS,clamp(s.cx+s.w*.55,30,G.W-40),s.t-6,"plus");
  sfx("ok");buzz(28);
  var from=c.el.style.transform,tx=s.cx-c.w/2,ty=s.cy-c.h/2;
  var el=c.el;
  if(el.animate&&!reduced){
    var a=el.animate([{transform:from,opacity:1},{transform:"translate3d("+tx+"px,"+ty+"px,0) scale(.18)",opacity:0}],{duration:240,easing:"cubic-bezier(.5,0,.8,.4)",fill:"forwards"});
    a.onfinish=function(){el.remove()};
  }else el.remove();
}
function fail(c,i){
  var s=G.slots[i],ri=TASKS[c.task].agent,r=G.slots[ri];
  G.remaining=Math.max(0,G.remaining-PENALTY);
  react(i,"oops");popup("−3 с",clamp(s.cx,40,G.W-40),s.t-6,"minus");
  restartAnim(visor,"shake");sfx("err");buzz([35,45,35]);
  c.state="gone";
  var n=agentNodes[ri];n.classList.add("guide");clearTimeout(n._g);n._g=setTimeout(function(){n.classList.remove("guide")},1100);
  var from=c.el.style.transform,tx=r.cx-c.w/2,ty=r.cy-c.h/2,el=c.el;
  if(el.animate&&!reduced){
    var a=el.animate([{transform:from,opacity:1},{transform:"translate3d("+tx+"px,"+ty+"px,0) scale(.2)",opacity:0}],{duration:520,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"});
    a.onfinish=function(){el.remove()};
  }else el.remove();
}

/* ---------------- confetti in field ---------------- */
var conf=$("#confetti"),cctx=conf.getContext("2d"),parts=[];
function sizeConfetti(){
  var r=$("#field").getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  conf.width=Math.round(r.width*dpr);conf.height=Math.round(r.height*dpr);conf._w=r.width;conf._h=r.height;
  cctx.setTransform(dpr,0,0,dpr,0,0);
  if(!parts.length)for(var i=0;i<26;i++)parts.push({x:Math.random(),y:Math.random(),r:rand(1.6,3.6),v:rand(.012,.035),c:Math.random()<.55?"18,165,160":"18,146,180",a:rand(.35,.75)});
}
/* холст пересчитывается при любом изменении размера поля (панели Safari, догрузка шрифтов), иначе точки растягиваются в капли */
if(window.ResizeObserver){new ResizeObserver(function(){sizeConfetti()}).observe($("#field"))}
function drawConfetti(dt){
  var w=conf._w||0,h=conf._h||0;if(!w)return;
  cctx.clearRect(0,0,w,h);
  for(var i=0;i<parts.length;i++){var p=parts[i];
    if(!reduced){p.y+=p.v*dt;if(p.y>1.02){p.y=-.02;p.x=Math.random()}}
    cctx.fillStyle="rgba("+p.c+","+p.a+")";cctx.beginPath();cctx.arc(p.x*w,p.y*h,p.r,0,6.2832);cctx.fill();
  }
}

/* ---------------- finale burst ---------------- */
var bcv=$("#burst"),bctx=bcv.getContext("2d");
function burst(){
  if(reduced)return;
  var dpr=Math.min(window.devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  bcv.width=W*dpr;bcv.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  var ps=[],cols=["#12A5A0","#1292B4","#9C6642","#5E3622"];
  [[.28,.22,0],[.74,.18,.25],[.5,.32,.5]].forEach(function(o){
    for(var i=0;i<46;i++){var a=Math.random()*6.2832,v=rand(90,300);
      ps.push({x:o[0]*W,y:o[1]*H,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,r:rand(2.4,4.6),c:cols[i%4],d:o[2],life:rand(1.6,2.4)});}
  });
  var t0=performance.now();
  (function step(now){
    var t=(now-t0)/1000;bctx.clearRect(0,0,W,H);var alive=false;
    ps.forEach(function(p){var tt=t-p.d;if(tt<0){alive=true;return}if(tt>p.life)return;alive=true;
      var x=p.x+p.vx*tt,y=p.y+p.vy*tt+170*tt*tt,a=1-tt/p.life;
      bctx.globalAlpha=a;bctx.fillStyle=p.c;bctx.beginPath();bctx.arc(x,y,p.r,0,6.2832);bctx.fill();});
    bctx.globalAlpha=1;
    if(alive)requestAnimationFrame(step);else bctx.clearRect(0,0,W,H);
  })(t0);
}

/* ---------------- flow ---------------- */
function reset(){
  G.cards.forEach(removeCard);G.cards=[];G.drag=null;trail.innerHTML="";fx.innerHTML="";dragLabel.classList.remove("on");
  agentNodes.forEach(function(n){n.classList.remove("hover","happy","oops","hit","guide")});showHint(false);
  G.remaining=DURATION;G.score=0;G.spawnT=.85;G.lastSec=-1;G.bag=[];G.time=0;G.paused=false;
  scoreEl.textContent="0";barFill.style.transform="scaleX(1)";
}
function startGame(){
  ensureAudio();reset();show("game");
  requestAnimationFrame(function(){layout();renderTimer();G.tutorial=!G.tutDone;if(G.tutorial)spawnTutorial();G.running=true;G.last=performance.now()});
}
function finish(){
  G.running=false;
  if(G.drag){agentNodes.forEach(function(n){n.classList.remove("hover")});G.drag=null;trail.innerHTML="";dragLabel.classList.remove("on")}
  G.cards.forEach(function(c){c.el.style.transition="opacity .3s";c.el.style.opacity=0});
  barFill.style.transform="scaleX(0)";
  sfx("end");buzz([60,60,120]);
  setTimeout(function(){
    G.cards.forEach(removeCard);G.cards=[];
    var prev=parseInt(store.get("gc_dodo_best")||"0",10)||0,record=G.score>prev&&G.score>0;
    if(record)store.set("gc_dodo_best",String(G.score));
    var best=Math.max(prev,G.score);
    var s=String(G.score),pitch=clamp(Math.floor(Math.min(vw()-92,300)/Math.max(matrixCols(s),9)),5,11);
    drawMatrix($("#finalScore"),s,pitch);
    var b=$("#best");
    b.className="best"+(record?" record":"");
    b.textContent=record?(prev>0?"Новый рекорд на этом устройстве":"Первый результат на этом устройстве"):"Лучший результат на этом устройстве: "+fmt(best);
    show("end");burst();
    // hook for stage 2: company leaderboard
    if(typeof window.onGameFinished==="function"){try{window.onGameFinished(G.score)}catch(e){}}
  },650);
}

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&G.running){G.paused=true;if(G.drag)drop(true)}
  else if(!document.hidden&&G.paused){G.paused=false;G.last=performance.now()}
});
window.addEventListener("resize",function(){
  if($("#game").classList.contains("on"))layout();
  drawMatrix($("#startTimer"),"01:00",startPitch());
});

$("#startBtn").addEventListener("click",startGame);
$("#againBtn").addEventListener("click",startGame);
$("#soundBtn").addEventListener("click",function(){soundOn=!soundOn;store.set("gc_dodo_sound",soundOn?"1":"0");renderSound();if(soundOn)ensureAudio()});

renderSound();
function startPitch(){return Math.max(5,timerPitch()-1)}
function initStart(){drawMatrix($("#startTimer"),"01:00",startPitch())}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(initStart);
initStart();
G.last=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
